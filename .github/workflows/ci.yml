name: OECL CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  oecl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript build
        run: npx tsc

      - name: Run positive experiment
        run: npm run experiment:positive
