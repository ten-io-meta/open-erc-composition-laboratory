name: OECL CI

on:
  push:
  pull_request:

jobs:
  oecl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript build
        run: npx tsc

      - name: Run positive experiment
        run: npm run experiment:positive

      - name: Joint composition evidence regression
        run: npx tsx scripts/check-joint-composition-evidence-bridge.ts

      - name: Native behavioral invariant and final polarity regression
        run: npx tsx scripts/check-native-behavioral-constraints.ts

      - name: Discovered candidate source and specification admission regression
        run: npx tsx scripts/check-discovered-candidate-admission.ts

      - name: Inherited capability exact-source and negative regression
        run: npx tsx scripts/check-inherited-capability-projection.ts

      - name: Pinned Solidity import closure safety regression
        run: npx tsx scripts/check-pinned-solidity-import-closure.ts
