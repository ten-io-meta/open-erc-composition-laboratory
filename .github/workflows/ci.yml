name: OECL CI

on:
  push:
  pull_request:

jobs:
  oecl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript build
        run: npx tsc

      - name: Run positive experiment
        run: npm run experiment:positive