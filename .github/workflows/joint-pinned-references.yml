name: OECL Joint Pinned ERC-8060 and ERC-8098

on:
  push:
  pull_request:

jobs:
  two-pinned-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OECL evidence producer
        uses: actions/checkout@v4
        with:
          path: oecl

      - name: Checkout pinned ERC-8060
        uses: actions/checkout@v4
        with:
          repository: ten-io-meta/erc8060-native-eth-value
          ref: c7eed906835ab39fbc8439eb0493e5a5371b23a2
          path: source-8060

      - name: Checkout pinned ERC-8098
        uses: actions/checkout@v4
        with:
          repository: ten-io-meta/erc8098-reference
          ref: 68a05289bd68d89db8453c49500e0a1ae6cd11ec
          path: source-8098

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned EVM dependencies
        working-directory: source-8060
        run: npm ci

      - name: Build joint test workspace from both immutable checkouts
        run: |
          cp source-8098/contracts/ERC8098Reference.sol source-8060/contracts/
          cp oecl/integrations/erc8060-erc8098/solidity/OECLJointRedemption.sol source-8060/contracts/
          cp oecl/integrations/erc8060-erc8098/test/OECLPinnedReferences.test.js source-8060/test/

      - name: Execute ERC-8060 and ERC-8098 in one local EVM
        working-directory: source-8060
        env:
          OECL_JOINT_EVIDENCE_PATH: ../joint-evidence/erc8060-erc8098-pinned.json
        run: npx hardhat test test/OECLPinnedReferences.test.js

      - name: Validate both source revisions and transaction evidence
        run: node oecl/integrations/erc8060-erc8098/validate-pinned-references.cjs source-8060 source-8098 joint-evidence/erc8060-erc8098-pinned.json

      - name: Install OECL native scientific evaluator
        working-directory: oecl
        run: npm ci

      - name: Extract pinned Solidity constraints and evaluate native evidence coverage
        working-directory: oecl
        run: npx tsx scripts/check-pinned-joint-native-source-admission.ts ../source-8060 ../source-8098 ../joint-evidence/erc8060-erc8098-pinned.json

      - name: Produce source-attributed ETH and monotone supply witnesses
        run: node oecl/integrations/erc8060-erc8098/evaluate-pinned-invariants.cjs source-8060 source-8098 joint-evidence/erc8060-erc8098-pinned.json

      - name: Adversarial tests for incomplete and manipulated invariant evidence
        run: node oecl/integrations/erc8060-erc8098/check-pinned-invariant-regression.cjs source-8060 source-8098 joint-evidence/erc8060-erc8098-pinned.json

      - name: Evaluate source-bound behavioral witnesses in OECL native constraint engine
        working-directory: oecl
        run: npx tsx scripts/check-pinned-behavioral-native-witness.ts ../joint-evidence/erc8060-erc8098-pinned.invariants.json ../joint-evidence/erc8060-erc8098-pinned.json

      - name: Apply discovery admission gate to pinned local-EVM candidate
        working-directory: oecl
        run: npx tsx scripts/check-pinned-candidate-admission.ts ../joint-evidence/erc8060-erc8098-pinned.native-behavioral.json

      - name: Discover genuine structural protocol candidates from both pinned Solidity sources
        working-directory: oecl
        run: npx tsx scripts/check-pinned-real-scientific-discovery.ts ../source-8060 ../source-8098 ../joint-evidence/erc8060-erc8098-source-discovery.json

      - name: Compare source-attributed NFT and ERC20 burn semantics
        working-directory: oecl
        run: npx tsx scripts/check-pinned-burn-semantic-distinction.ts ../joint-evidence/erc8060-erc8098-source-discovery.json ../joint-evidence/erc8060-erc8098-pinned.invariants.json ../joint-evidence/erc8060-erc8098-burn-semantics.json

      - name: Upload joint transaction and provenance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oecl-two-pinned-references
          path: joint-evidence/*.json
          if-no-files-found: warn
