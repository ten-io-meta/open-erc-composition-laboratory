name: OECL All Published ERC Documentary Matrix

on:
  pull_request:
    paths:
      - "web/scripts/audit-all-erc-documentary-matrix.mjs"
      - "web/scripts/generate-all-erc-scientific-falsification-agenda.mjs"
      - "web/scripts/oecl-spec-anchor.mjs"
      - "web/scripts/check-erc-spec-anchor.mjs"
      - "web/scripts/check-erc-corpus-falsification-provenance.mjs"
      - "web/scripts/erc-semantic-review-profiles.json"
      - "web/scripts/generate-deep-erc-semantic-research.mjs"
      - "web/scripts/check-deep-erc-semantic-research.mjs"
      - "web/scripts/check-erc7837-erc8098-conditional-tension.mjs"
      - "web/scripts/check-registered-source-pair-matrix.mjs"
      - "web/src/server/oeclErcDocumentaryDiscovery.ts"
      - ".github/workflows/oecl-all-erc-documentary-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oecl-all-erc-documentary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentary-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout OECL research code
        uses: actions/checkout@v4
        with:
          path: oecl
          persist-credentials: false
      - name: Checkout immutable official ERC documentation (read-only)
        uses: actions/checkout@v4
        with:
          repository: ethereum/ERCs
          ref: e9c1adc6ad36faec8a6bc509cc8a14ec9b8f741d
          path: official-ercs
          persist-credentials: false
      - name: Checkout immutable ERC-8098 candidate source (not a normative ERC certification)
        uses: actions/checkout@v4
        with:
          repository: ten-io-meta/erc8098-reference
          ref: 68a05289bd68d89db8453c49500e0a1ae6cd11ec
          path: pinned-8098
          persist-credentials: false
      - name: Set up Node.js without running Solidity
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify pinned revision and test all official ERC documentary pairs
        run: |
          test "$(git -C official-ercs rev-parse HEAD)" = "e9c1adc6ad36faec8a6bc509cc8a14ec9b8f741d"
          node --experimental-strip-types oecl/web/scripts/audit-all-erc-documentary-matrix.mjs official-ercs/ERCS audit-output/all-erc-documentary-matrix.json
          node --experimental-strip-types oecl/web/scripts/generate-all-erc-scientific-falsification-agenda.mjs official-ercs/ERCS audit-output/all-erc-documentary-matrix.json audit-output/all-erc-scientific-falsification-agenda.json
          node oecl/web/scripts/check-erc-spec-anchor.mjs
          node oecl/web/scripts/check-erc-corpus-falsification-provenance.mjs official-ercs/ERCS audit-output/all-erc-scientific-falsification-agenda.json
          node oecl/web/scripts/generate-deep-erc-semantic-research.mjs official-ercs/ERCS audit-output/all-erc-scientific-falsification-agenda.json audit-output/deep-erc-scientific-hypotheses.json
          node oecl/web/scripts/check-deep-erc-semantic-research.mjs official-ercs/ERCS audit-output/deep-erc-scientific-hypotheses.json audit-output/all-erc-scientific-falsification-agenda.json
          test "$(git -C pinned-8098 rev-parse HEAD)" = "68a05289bd68d89db8453c49500e0a1ae6cd11ec"
          node oecl/web/scripts/check-erc7837-erc8098-conditional-tension.mjs official-ercs/ERCS/erc-7837.md pinned-8098/contracts/ERC8098Reference.sol audit-output/all-erc-scientific-falsification-agenda.json audit-output/erc7837-erc8098-conditional-invariant-tension.json
          node oecl/web/scripts/check-registered-source-pair-matrix.mjs oecl/.github/workflows/oecl-generic-source-lab.yml audit-output/registered-source-pairs.json
      - name: Archive documentary manifest with SHA-256 provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oecl-all-erc-documentary-matrix
          path: audit-output/*.json
          if-no-files-found: warn
          retention-days: 14
