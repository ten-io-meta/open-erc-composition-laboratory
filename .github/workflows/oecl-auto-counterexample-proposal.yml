name: OECL Source-Bound Autonomous Counterexample Proposal and Local Replay

on:
  pull_request:
    paths:
      - "laboratory/scientific-open-source-worker/SourceBoundExperimentProposalPlanner.cjs"
      - "laboratory/scientific-open-source-worker/run-auto-counterexample-proposal.cjs"
      - "scripts/check-auto-counterexample-proposal.test.cjs"
      - "scripts/review-auto-counterexample-proposal.cjs"
      - "scripts/check-auto-counterexample-falsifiers.cjs"
      - ".github/workflows/oecl-auto-counterexample-proposal.yml"
      - "docs/oecl-auto-counterexample-proposal.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preregister-automatic-candidate-and-local-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          path: oecl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ten-io-meta/erc8060-native-eth-value
          ref: c7eed906835ab39fbc8439eb0493e5a5371b23a2
          path: dependency-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: transmissions11/solmate
          ref: 89365b880c4f3c786bdd453d4b8e8fe410344a69
          path: solmate-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked compiler and test EVM without package scripts
        working-directory: oecl/integrations/secure-evm-toolchain
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=moderate
      - name: Prove exact Solmate Git blobs, dependency revision and lock hash
        run: |
          test "$(git -C dependency-source rev-parse HEAD)" = "c7eed906835ab39fbc8439eb0493e5a5371b23a2"
          test "$(git -C solmate-source rev-parse HEAD)" = "89365b880c4f3c786bdd453d4b8e8fe410344a69"
          echo "73a70b40bad9d064a244d1a36986b78be9adedc85d2043a6431add0c428b41b1  dependency-source/package-lock.json" | sha256sum --check
          ln -s ../oecl/integrations/secure-evm-toolchain/node_modules dependency-source/node_modules
          node oecl/scripts/check-solmate-pinned-source.cjs solmate-source
      - name: Test deterministic bounded hypothesis search, minimality and unsafe input rejection
        run: node --test oecl/scripts/check-auto-counterexample-proposal.test.cjs
      - name: Generate source-bound candidate without dispatching a single transaction
        run: |
          node oecl/laboratory/scientific-open-source-worker/run-auto-counterexample-proposal.cjs propose dependency-source solmate-source automatic-evidence
          node -e 'const p=require("./automatic-evidence/autogenerated-counterexample-proposal.json");if(p.status!=="GENERATED_SOURCE_BOUND_CANDIDATE_NEEDS_REVIEW"||p.selection.donation!==2||p.selection.withdrawal!==21||p.executionAuthorized||p.evmExecuted||p.requestedAuthorizations.some(x=>x.granted))throw Error("UNSAFE_AUTOMATIC_EXPERIMENT_PROPOSAL")'
          test ! -f automatic-evidence/autogenerated-counterexample-witness.json
      - name: Fail closed if user or CI replay policy has not authorized local dispatch
        env:
          HARDHAT_NETWORK: hardhat
        run: |
          if node oecl/laboratory/scientific-open-source-worker/run-auto-counterexample-proposal.cjs execute dependency-source solmate-source automatic-evidence; then
            echo "SCIENCE_EXECUTION_ALLOWED_WITHOUT_REVIEWED_LOCAL_CI_GATE" >&2
            exit 1
          fi
          test ! -f automatic-evidence/autogenerated-counterexample-witness.json
      - name: Replay exactly generated experiment under explicitly reviewed CI-local-only policy
        env:
          HARDHAT_NETWORK: hardhat
          OECL_REVIEWED_LOCAL_REPLAY: REVIEWED_SOURCE_CI_GATE_V1
        run: |
          node oecl/laboratory/scientific-open-source-worker/run-auto-counterexample-proposal.cjs execute dependency-source solmate-source automatic-evidence
          node -e 'const w=require("./automatic-evidence/autogenerated-counterexample-witness.json");if(w.minedReceipts!==14||w.unminedControls!==6||w.hypothesis.ozBurnedShares!=="21"||w.hypothesis.solmateBurnedShares!=="20"||w.candidateAdmission!=="NOT_ADMITTED")throw Error("BAD_AUTO_CANDIDATE_LOCAL_EVM_WITNESS")'
      - name: Independently reject forged proposal approvals, receipt histories and economic evidence
        run: node oecl/scripts/check-auto-counterexample-falsifiers.cjs automatic-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oecl-auto-counterexample-source-and-local-evidence
          path: automatic-evidence/*.json
          retention-days: 14
          if-no-files-found: warn

  independent-candidate-and-evidence-reconstruction:
    needs: preregister-automatic-candidate-and-local-replay
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          path: oecl
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ten-io-meta/erc8060-native-eth-value
          ref: c7eed906835ab39fbc8439eb0493e5a5371b23a2
          path: dependency-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: transmissions11/solmate
          ref: 89365b880c4f3c786bdd453d4b8e8fe410344a69
          path: solmate-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: oecl-auto-counterexample-source-and-local-evidence
          path: archived
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reinstall independent pinned source and compiler
        working-directory: oecl/integrations/secure-evm-toolchain
        run: npm ci --ignore-scripts --no-fund
      - name: Check pinned compiler revision, four Git blobs and lock integrity again
        run: |
          test "$(git -C dependency-source rev-parse HEAD)" = "c7eed906835ab39fbc8439eb0493e5a5371b23a2"
          test "$(git -C solmate-source rev-parse HEAD)" = "89365b880c4f3c786bdd453d4b8e8fe410344a69"
          echo "73a70b40bad9d064a244d1a36986b78be9adedc85d2043a6431add0c428b41b1  dependency-source/package-lock.json" | sha256sum --check
          ln -s ../oecl/integrations/secure-evm-toolchain/node_modules dependency-source/node_modules
          node oecl/scripts/check-solmate-pinned-source.cjs solmate-source
      - name: Regenerate exact proposal from compiler ABI AST source and reviewed model bounds
        run: |
          node oecl/laboratory/scientific-open-source-worker/run-auto-counterexample-proposal.cjs propose dependency-source solmate-source independent
      - name: Compare generated proposal and independently reconcile signed local receipts and state math
        run: |
          node oecl/scripts/review-auto-counterexample-proposal.cjs archived independent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oecl-auto-counterexample-independent-review
          path: independent/*.json
          retention-days: 14
          if-no-files-found: warn
