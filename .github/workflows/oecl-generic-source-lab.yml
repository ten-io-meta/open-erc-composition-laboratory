name: OECL Generic Solidity Source AST Laboratory
run-name: ${{ github.event_name == 'workflow_dispatch' && format('OECL-SOURCE-REQUEST-{0}', inputs.request_id) || format('OECL-SOURCE-REGRESSION-{0}', github.run_id) }}

on:
  push:
    paths:
      - 'integrations/secure-evm-toolchain/**'
      - 'laboratory/scientific-open-source-worker/**'
      - 'scripts/check-generic-source-worker.cjs'
      - 'scripts/check-source-graph-view.cjs'
      - 'scripts/check-ast-path-feasibility.cjs'
      - 'scripts/check-source-path-feasibility-artifacts.cjs'
      - 'laboratory/scientific-open-source-worker/ScientificGraphView.cjs'
      - '.github/workflows/oecl-generic-source-lab.yml'
  pull_request:
    paths:
      - 'integrations/secure-evm-toolchain/**'
      - 'laboratory/scientific-open-source-worker/**'
      - 'scripts/check-generic-source-worker.cjs'
      - 'scripts/check-source-graph-view.cjs'
      - 'scripts/check-ast-path-feasibility.cjs'
      - 'scripts/check-source-path-feasibility-artifacts.cjs'
      - 'laboratory/scientific-open-source-worker/ScientificGraphView.cjs'
      - '.github/workflows/oecl-generic-source-lab.yml'
  workflow_dispatch:
    inputs:
      request_id:
        description: 'UUIDv4 used only for job correlation'
        required: true
        type: string
      source_a:
        description: 'First immutable registered source'
        required: true
        type: choice
        options: [ERC-8060, ERC-8098, ERC-20, ERC-721, ERC-1155, ERC-20-BURNABLE, ERC-165, ERC-2612, ERC-2981, ERC-4626]
      source_b:
        description: 'Second immutable registered source'
        required: true
        type: choice
        options: [ERC-8060, ERC-8098, ERC-20, ERC-721, ERC-1155, ERC-20-BURNABLE, ERC-165, ERC-2612, ERC-2981, ERC-4626]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'oecl-source-laboratory-controlled' || github.run_id }}
  cancel-in-progress: false

jobs:
  independent-source-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout trusted OECL AST worker
        uses: actions/checkout@v4
        with:
          path: oecl
          persist-credentials: false

      - name: Checkout immutable dependency toolchain source
        uses: actions/checkout@v4
        with:
          repository: ten-io-meta/erc8060-native-eth-value
          ref: c7eed906835ab39fbc8439eb0493e5a5371b23a2
          path: dependency-source
          persist-credentials: false

      - name: Setup audited Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install audited isolated compiler toolchain with exact OECL lock
        working-directory: oecl/integrations/secure-evm-toolchain
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=moderate

      - name: Mount isolated compiler and OpenZeppelin into immutable research checkout
        run: |
          test "$(git -C dependency-source rev-parse HEAD)" = "c7eed906835ab39fbc8439eb0493e5a5371b23a2"
          echo "73a70b40bad9d064a244d1a36986b78be9adedc85d2043a6431add0c428b41b1  dependency-source/package-lock.json" | sha256sum --check
          ln -s ../oecl/integrations/secure-evm-toolchain/node_modules dependency-source/node_modules
          node -e 'const fs=require("node:fs");const o=require("./dependency-source/node_modules/@openzeppelin/contracts/package.json");const s=require("./dependency-source/node_modules/solc");if(o.version!=="4.9.6"||!s.version().startsWith("0.8.26+"))process.exit(1);console.log("OECL_SECURE_AST_TOOLCHAIN:",o.version,s.version())'

      - name: Run generic source and provenance falsification controls
        run: node oecl/scripts/check-generic-source-worker.cjs

      - name: Falsify contradictory guards, inherited modifiers and AST path assumptions
        run: node oecl/scripts/check-ast-path-feasibility.cjs

      - name: Reject invalid workflow request before any source fetch
        if: github.event_name == 'workflow_dispatch'
        env:
          OECL_REQUEST_ID: ${{ inputs.request_id }}
          OECL_SOURCE_A: ${{ inputs.source_a }}
          OECL_SOURCE_B: ${{ inputs.source_b }}
        run: |
          node -e 'const id=process.env.OECL_REQUEST_ID||"";const a=process.env.OECL_SOURCE_A,b=process.env.OECL_SOURCE_B;const registry=require("./oecl/laboratory/scientific-open-source-worker/source-registry.json");if(!/^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$/i.test(id)||a===b||![a,b].every(id=>registry.sources.some(s=>s.id===id))){console.error("OECL_INVALID_GENERIC_REQUEST");process.exit(1)}'

      - name: Discover sources and generate independent AST hypotheses
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OECL_REQUEST_ID: ${{ inputs.request_id }}
          OECL_SOURCE_A: ${{ inputs.source_a }}
          OECL_SOURCE_B: ${{ inputs.source_b }}
        run: |
          node oecl/laboratory/scientific-open-source-worker/run-generic-source-worker.cjs "$OECL_SOURCE_A" "$OECL_SOURCE_B" dependency-source source-output
          node -e 'const fs=require("node:fs");fs.writeFileSync("source-output/request.json",JSON.stringify({schemaVersion:"OECL_GENERIC_SOURCE_REQUEST_V1",requestId:process.env.OECL_REQUEST_ID,runId:process.env.GITHUB_RUN_ID,workflowSha:process.env.GITHUB_SHA,sourceA:process.env.OECL_SOURCE_A,sourceB:process.env.OECL_SOURCE_B,scientificVerdict:"INCONCLUSIVE",candidateAdmission:"NOT_ADMITTED"},null,2)+"\n")'

      - name: Run real source acquisition and AST discovery on independent pairs
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node oecl/laboratory/scientific-open-source-worker/run-generic-source-worker.cjs ERC-8060 ERC-8098 dependency-source source-output/pair-8060-8098
          node oecl/laboratory/scientific-open-source-worker/run-generic-source-worker.cjs ERC-8060 ERC-20-BURNABLE dependency-source source-output/pair-8060-20burnable
          node oecl/laboratory/scientific-open-source-worker/run-generic-source-worker.cjs ERC-8098 ERC-20 dependency-source source-output/pair-8098-20
          node oecl/laboratory/scientific-open-source-worker/run-generic-source-worker.cjs ERC-1155 ERC-20 dependency-source source-output/pair-1155-20
          node oecl/laboratory/scientific-open-source-worker/run-generic-source-worker.cjs ERC-4626 ERC-20 dependency-source source-output/pair-4626-20
          node oecl/laboratory/scientific-open-source-worker/run-generic-source-worker.cjs ERC-721 ERC-165 dependency-source source-output/pair-721-165
          node oecl/laboratory/scientific-open-source-worker/run-generic-source-worker.cjs ERC-2981 ERC-721 dependency-source source-output/pair-2981-721
          node oecl/laboratory/scientific-open-source-worker/run-generic-source-worker.cjs ERC-2612 ERC-20 dependency-source source-output/pair-2612-20
          node oecl/laboratory/scientific-open-source-worker/run-generic-source-worker.cjs ERC-8060 ERC-4626 dependency-source source-output/pair-8060-4626
          node -e 'const fs=require("node:fs");for(const folder of ["pair-8060-8098","pair-8060-20burnable","pair-8098-20"]){const r=JSON.parse(fs.readFileSync("source-output/"+folder+"/source-scientific-report.json","utf8"));if(r.scientificVerdict!=="INCONCLUSIVE"||r.candidateAdmission!=="NOT_ADMITTED"||r.counts.hypotheses<1){console.error("OECL_GENERIC_DISCOVERY_REGRESSION:"+folder);process.exit(1)}}'
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync("source-output/pair-1155-20/source-scientific-report.json","utf8"));if(r.scientificVerdict!=="INCONCLUSIVE"||r.candidateAdmission!=="NOT_ADMITTED"||r.counts.hypotheses!==0||r.discoveryReason!=="NO_ADMISSIBLE_SOURCE_RELATION_DISCOVERED"){console.error("OECL_NEGATIVE_DISCOVERY_MUST_REMAIN_INCONCLUSIVE");process.exit(1)}'
          node -e 'const fs=require("node:fs");for(const [dir,a,b] of [["pair-4626-20","ERC-4626","ERC-20"],["pair-721-165","ERC-721","ERC-165"],["pair-2981-721","ERC-2981","ERC-721"],["pair-2612-20","ERC-2612","ERC-20"],["pair-8060-4626","ERC-8060","ERC-4626"]]){const r=JSON.parse(fs.readFileSync("source-output/"+dir+"/source-scientific-report.json","utf8"));if(r.selected?.map(x=>x.id).join("|")!==a+"|"+b||r.scientificVerdict!=="INCONCLUSIVE"||r.candidateAdmission!=="NOT_ADMITTED"||r.sourceOnly!==true||r.evmExecuted!==false||r.counts.sourceUnits<2)throw Error("NEW_AST_PAIR_FAILED:"+dir)}console.log("OECL_FIVE_ADDITIONAL_REAL_AST_PAIRS:PASS")'

      - name: Check path feasibility reports and executable-EVM experiment proposals on real pinned sources
        if: github.event_name != 'workflow_dispatch'
        run: node oecl/scripts/check-source-path-feasibility-artifacts.cjs source-output

      - name: Verify and project four independently sourced AST graphs for browser exploration
        if: github.event_name != 'workflow_dispatch'
        run: node oecl/scripts/check-source-graph-view.cjs source-output

      - name: Upload source-only graph and provenance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oecl-generic-ast-evidence
          path: source-output/**/*.json
          if-no-files-found: warn
          retention-days: 14
