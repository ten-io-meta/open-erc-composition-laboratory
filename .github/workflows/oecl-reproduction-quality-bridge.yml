name: OECL Reproduced EVM Scientific Quality Bridge

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/oecl-reproduction-quality-bridge.yml'
      - '.github/workflows/web-scientific-dossier.yml'
      - 'docs/oecl-reproduced-evm-quality-bridge.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preregister-and-original-evm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ten-io-meta/open-erc-composition-laboratory
          ref: c7fb535fba976488f3a0c24dba2b700b5938dbfd
          path: science-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ten-io-meta/erc8060-native-eth-value
          ref: c7eed906835ab39fbc8439eb0493e5a5371b23a2
          path: dependency-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: transmissions11/solmate
          ref: 89365b880c4f3c786bdd453d4b8e8fe410344a69
          path: solmate-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Solidity compiler and Hardhat without package scripts
        working-directory: science-source/integrations/secure-evm-toolchain
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=moderate
      - name: Recheck immutable source revisions, lockfile and 4 Solmate Git blobs
        run: |
          test "$(git -C science-source rev-parse HEAD)" = "c7fb535fba976488f3a0c24dba2b700b5938dbfd"
          test "$(git -C dependency-source rev-parse HEAD)" = "c7eed906835ab39fbc8439eb0493e5a5371b23a2"
          test "$(git -C solmate-source rev-parse HEAD)" = "89365b880c4f3c786bdd453d4b8e8fe410344a69"
          echo "73a70b40bad9d064a244d1a36986b78be9adedc85d2043a6431add0c428b41b1  dependency-source/package-lock.json" | sha256sum --check
          ln -s ../science-source/integrations/secure-evm-toolchain/node_modules dependency-source/node_modules
          node science-source/scripts/check-solmate-pinned-source.cjs solmate-source
      - name: Generate a bounded scientific candidate but do not authorize execution
        run: |
          node science-source/laboratory/scientific-open-source-worker/run-auto-counterexample-proposal.cjs propose dependency-source solmate-source original
          node -e 'const p=require("./original/autogenerated-counterexample-proposal.json");if(p.selection.donation!==2||p.selection.withdrawal!==21||p.executionAuthorized||p.evmExecuted||p.requestedAuthorizations.some(x=>x.granted))throw Error("UNSAFE_SOURCE_PROPOSAL")'
      - name: Actually mine first local EVM under reviewed CI-only policy
        env:
          HARDHAT_NETWORK: hardhat
          OECL_REVIEWED_LOCAL_REPLAY: REVIEWED_SOURCE_CI_GATE_V1
        run: |
          node science-source/laboratory/scientific-open-source-worker/run-auto-counterexample-proposal.cjs execute dependency-source solmate-source original
          node science-source/scripts/check-auto-counterexample-falsifiers.cjs original
      - uses: actions/upload-artifact@v4
        with:
          name: oecl-quality-bridge-original-evidence
          path: original/*.json
          retention-days: 14

  independent-local-evm-replay:
    needs: preregister-and-original-evm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ten-io-meta/open-erc-composition-laboratory
          ref: c7fb535fba976488f3a0c24dba2b700b5938dbfd
          path: science-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ten-io-meta/erc8060-native-eth-value
          ref: c7eed906835ab39fbc8439eb0493e5a5371b23a2
          path: dependency-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: transmissions11/solmate
          ref: 89365b880c4f3c786bdd453d4b8e8fe410344a69
          path: solmate-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: oecl-quality-bridge-original-evidence
          path: original
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install compiler and EVM independently from source lock
        working-directory: science-source/integrations/secure-evm-toolchain
        run: npm ci --ignore-scripts --no-fund
      - name: Verify pinned source and code profiles again
        run: |
          test "$(git -C science-source rev-parse HEAD)" = "c7fb535fba976488f3a0c24dba2b700b5938dbfd"
          test "$(git -C dependency-source rev-parse HEAD)" = "c7eed906835ab39fbc8439eb0493e5a5371b23a2"
          test "$(git -C solmate-source rev-parse HEAD)" = "89365b880c4f3c786bdd453d4b8e8fe410344a69"
          echo "73a70b40bad9d064a244d1a36986b78be9adedc85d2043a6431add0c428b41b1  dependency-source/package-lock.json" | sha256sum --check
          ln -s ../science-source/integrations/secure-evm-toolchain/node_modules dependency-source/node_modules
          node science-source/scripts/check-solmate-pinned-source.cjs solmate-source
      - name: Reprove independent runner cannot dispatch without its separate CI policy gate
        env:
          HARDHAT_NETWORK: hardhat
        run: |
          if node science-source/laboratory/scientific-open-source-worker/replay-auto-counterexample-second-evm.cjs dependency-source solmate-source original/autogenerated-counterexample-proposal.json second; then
            echo "SECOND_LOCAL_EVM_EXECUTED_WITHOUT_APPROVAL" >&2
            exit 1
          fi
          test ! -f second/independent-second-evm-witness.json
      - name: Compile afresh and mine 14 new transactions plus 6 unmined controls
        env:
          HARDHAT_NETWORK: hardhat
          OECL_SECOND_RUNNER_LOCAL_REPLAY: CI_REVIEWED_EXACT_SOURCE_V1
        run: |
          node science-source/laboratory/scientific-open-source-worker/replay-auto-counterexample-second-evm.cjs dependency-source solmate-source original/autogenerated-counterexample-proposal.json second
      - uses: actions/upload-artifact@v4
        with:
          name: oecl-quality-bridge-independent-evidence
          path: second/*.json
          retention-days: 14

  independently-audit-and-gate-claims:
    needs: independent-local-evm-replay
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          path: integration
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ten-io-meta/open-erc-composition-laboratory
          ref: c7fb535fba976488f3a0c24dba2b700b5938dbfd
          path: science-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: oecl-quality-bridge-original-evidence
          path: original
      - uses: actions/download-artifact@v4
        with:
          name: oecl-quality-bridge-independent-evidence
          path: second
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Independently reproduce original source-level economic receipt comparison
        run: |
          node science-source/scripts/compare-auto-counterexample-independent-evms.cjs original second quality-review
      - name: Inspect BOTH complete EVM witness archives, typed event effects and all eth_call controls
        run: |
          node integration/web/scripts/verify-vault-reproduction.mjs original/autogenerated-counterexample-proposal.json original/autogenerated-counterexample-witness.json second/independent-second-evm-witness.json quality-review/cross-run-scientific-reconciliation.json fresh
      - name: Reject 55 forged full-witness archive histories, source models and promoted compatibility claims
        run: |
          node integration/web/scripts/check-vault-reproduction-falsifiers.mjs original/autogenerated-counterexample-proposal.json original/autogenerated-counterexample-witness.json second/independent-second-evm-witness.json quality-review/cross-run-scientific-reconciliation.json fresh
      - name: Independently reject 45 falsified documentary-to-reproduction quality addenda
        working-directory: integration/web
        run: |
          node --experimental-strip-types scripts/check-reproduced-scientific-addendum.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oecl-quality-bridge-reconciliation
          path: quality-review/*.json
          retention-days: 14
          if-no-files-found: warn
