name: One-shot materialize open ERC proposal source snapshot
on:
  pull_request:
    paths:
      - "web/src/data/openErcProposalIndex.json"
      - ".github/workflows/one-shot-open-erc-proposal-snapshot.yml"
permissions:
  contents: write
jobs:
  materialize:
    if: >-
      github.event.pull_request.number == 5 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/erc-community-science-evidence-gates-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Index all open ERC PRs with pinned file and provenance checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/index-open-erc-proposals.mjs
      - name: Validate results without promoting proposals to accepted standards
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync,copyFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('audit-results/open-erc-proposals.json','utf8'));
          if(d.scannedOpenPullRequests<200||d.proposals.length<200||!d.proposals.some(x=>x.id==='ERC-8060')||
             d.proposals.some(x=>x.status!=='OPEN_PROPOSAL_PR')||d.errors.length>15)
            throw Error('Proposal corpus count, status or upstream consistency gate failed');
          copyFileSync('audit-results/open-erc-proposals.json','web/src/data/openErcProposalIndex.json');
          console.log('OECL_PROPOSAL_INDEX_VALIDATED',JSON.stringify({
            prs:d.scannedOpenPullRequests,documents:d.proposals.length,
            inconsistencies:d.errors.length,coverage:d.coverage
          }));
          NODE
      - name: Commit only new documentary data and remove privileged workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/data/openErcProposalIndex.json
          git rm .github/workflows/one-shot-open-erc-proposal-snapshot.yml
          git diff --cached --stat
          git commit -m "data(research): materialize 2026 open ERC proposal snapshot with upstream issue flags"
          git push origin HEAD:feature/erc-community-science-evidence-gates-v1
