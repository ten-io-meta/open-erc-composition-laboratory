name: OECL Scientific Regression PR9

on:
  push:
  pull_request:

jobs:
  scientific-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Run complete existing scientific regression suite
        run: npm run scientific:regression
