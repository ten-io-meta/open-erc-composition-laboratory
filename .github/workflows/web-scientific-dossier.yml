name: OECL Web Scientific Dossier

on:
  push:
    paths:
      - 'web/**'
      - 'laboratory/scientific-open-source-worker/**'
      - 'integrations/erc8060-erc20-burnable/**'
      - '.github/workflows/web-scientific-dossier.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'laboratory/scientific-open-source-worker/**'
      - 'integrations/erc8060-erc20-burnable/**'
      - '.github/workflows/web-scientific-dossier.yml'

concurrency:
  group: oecl-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dossier-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact web dependencies
        run: npm ci
      - name: Test pinned dossier digest, scope and negative controls
        run: node scripts/check-scientific-dossier.mjs
      - name: Verify controlled on-demand job policy and mock GitHub dispatch
        run: node --experimental-strip-types scripts/check-on-demand-jobs.mjs
      - name: Verify generic source-job dispatch and source selection policy
        run: node scripts/check-generic-source-jobs.cjs
      - name: Reject malformed ERC-165 identity evidence before scientific admission
        run: node --experimental-strip-types scripts/check-erc165-boolean-encoding.mjs
      - name: Verify full ERC registry directory, indexes and safe local fallbacks
        run: node --experimental-strip-types scripts/check-erc-catalog.mjs
      - name: Verify arbitrary ERC documentary discovery, provenance and fail-closed behavior
        run: node --experimental-strip-types scripts/check-erc-documentary-discovery.mjs
      - name: Blind adversarial tests of any-ERC scientist plans, explicit falsifiers and abstentions
        run: node --experimental-strip-types scripts/check-autonomous-research-planner.mjs
      - name: Independently falsify scientific quality contracts, source claims, EVM promotion and digest forgeries
        run: node --experimental-strip-types scripts/check-scientific-quality-contract.mjs
      - name: Independently reconstruct portable quality artifacts from separate source inputs
        run: node --experimental-strip-types scripts/check-portable-scientific-quality.mjs
      - name: Reject fabricated conclusions, invented EVM observations and unproven utility in both reviewers
        run: node --experimental-strip-types scripts/check-scientific-claim-ledger.mjs
      - name: Verify scientific AST snapshots and ZIP integrity
        run: node --experimental-strip-types scripts/check-source-graph-view.mjs
      - name: Verify independent EVM receipts and native source property snapshot
        run: node scripts/check-independent-evm.mjs
      - name: Lint web
        run: npm run lint
      - name: Compile production web
        run: npm run build
      - name: Smoke-test production dossier API and download
        run: node scripts/smoke-scientific-dossier.mjs
      - name: Exercise production user journey in headless Chrome
        run: node scripts/check-browser-user-journey.mjs

  verify-deployed-production:
    name: Verify actual Vercel production journey after main release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: dossier-web
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout verified main source
        uses: actions/checkout@v4
      - name: Set up browser test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise published production route, source/EVM evidence and mobile journey
        env:
          OECL_BROWSER_BASE_URL: https://open-erc-composition-laboratory.vercel.app
        run: node scripts/check-browser-user-journey.mjs
